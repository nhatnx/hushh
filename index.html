<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d4785a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hushh">
  <meta name="description" content="Understand your baby's cries with on-device AI. No audio ever leaves your phone.">

  <!-- Open Graph -->
  <meta property="og:title" content="Hushh">
  <meta property="og:description" content="On-device baby cry analysis — 100% private, no cloud required.">
  <meta property="og:type" content="website">

  <title>Hushh - Understand baby's cry with AI</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">

  <!-- Apply saved theme before first paint to prevent flash -->
  <script>(function(){document.documentElement.dataset.theme=localStorage.getItem('hushh-theme')||'system';})();</script>

  <!-- TensorFlow.js — loaded early to warm up WASM backend -->
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js" integrity="sha384-R4iglwC8w7UAyfRq7VUmXEPjrvYnoXIqhsbTUN07o6o8yKYeiTY0/Z6DzbsKgWZ3" crossorigin="anonymous">
</head>

<body>

  <main class="app-shell" role="main">
    <h1 class="sr-only">Hushh — on-device AI baby cry analyzer</h1>

    <!-- Header -->
    <header class="app-header">
      <div class="header-controls">
        <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">VI</button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">🌓</button>
      </div>
      <div class="app-logo" aria-hidden="true">🍼</div>
      <h1 class="app-title">Hushh</h1>
      <p class="app-tagline" data-i18n="tagline">Understand what your little one needs</p>
      <span class="privacy-pill" id="privacyBadge" aria-label="Privacy guarantee">
        🔒 Loading…
      </span>
    </header>

    <!-- PWA Install Banner -->
    <div class="install-banner hidden" id="installBanner" role="complementary" aria-label="Install app">
      <span class="banner-icon" aria-hidden="true">📲</span>
      <div class="banner-text">
        <strong class="banner-title" data-i18n="install.title">Add to Home Screen</strong>
        <span class="banner-sub" data-i18n="install.sub">Works offline · instant access</span>
      </div>
      <button class="btn-install" id="installBtn" type="button" data-i18n="install.btn">Install</button>
    </div>

    <!-- Model status -->
    <div class="model-badge" id="modelBadge" data-status="loading" role="status" aria-live="polite">
      ⏳ Loading on-device model…
    </div>

    <!-- Record Card -->
    <section class="record-card" aria-label="Audio recording">
      <button class="record-btn" id="recordBtn" type="button" aria-label="Record baby cry" aria-pressed="false">
        <span class="mic-icon" aria-hidden="true" id="micIcon">🎙</span>
        <span class="record-btn-label" id="recordBtnLabel">Record cry</span>
      </button>

      <p class="record-hint" id="recordHint">
        Tap the button and hold your phone near the baby
      </p>

      <div class="timer-display" id="timerDisplay" role="timer" aria-live="polite"></div>

      <!-- Live waveform (shown while recording) -->
      <div class="wave-section hidden" id="waveSection" aria-hidden="true">
        <div class="wave-wrap">
          <canvas id="waveCanvas" aria-label="Audio waveform"></canvas>
        </div>
      </div>

      <!-- Audio ready confirmation -->
      <p class="audio-ready-msg hidden" id="audioReadyMsg" role="status" aria-live="polite"></p>
    </section>

    <!-- Upload Alternative -->
    <div class="or-divider" aria-hidden="true" data-i18n="or">or</div>

    <button class="upload-btn" id="uploadTrigger" type="button" aria-label="Upload audio file">
      <span aria-hidden="true">📁</span>
      <span data-i18n="upload.btn">Upload audio file (.wav · .mp3 · .m4a · .webm)</span>
    </button>
    <input type="file" id="fileInput" accept="audio/*" style="display:none" aria-label="Audio file input">

    <!-- Processing status -->
    <p class="processing-step" id="processingStep" role="status" aria-live="polite"></p>

    <!-- Analyze Button -->
    <button class="analyze-btn" id="analyzeBtn" type="button" disabled aria-label="Analyze baby cry">
      🔍 Analyze cry
    </button>

    <!-- Result -->
    <section class="result-section hidden" id="resultSection" aria-label="Analysis results" aria-live="polite">
    </section>

    <!-- Session stats -->
    <p class="session-count hidden" id="sessionCount"></p>

    <!-- History -->
    <section class="history-section hidden" id="historySection" aria-label="Recent sessions">
      <div class="history-header">
        <span class="section-title" data-i18n="history.title">Recent sessions</span>
        <button class="btn-clear" id="clearHistoryBtn" type="button" data-i18n="history.clear">Clear</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

  </main>

  <!-- Load TF.js, then app modules -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js" integrity="sha384-R4iglwC8w7UAyfRq7VUmXEPjrvYnoXIqhsbTUN07o6o8yKYeiTY0/Z6DzbsKgWZ3" crossorigin="anonymous"></script>
  <script type="module" src="app.js"></script>

</body>

</html>
